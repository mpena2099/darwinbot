name: firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-platformio
      - name: Install PlatformIO
        run: pip install platformio
      # The toolchains are the slow part; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: .pio-core
          key: pio-core-${{ hashFiles('firmware/esp32/platformio.ini') }}
      - name: Build esp32 (web + serial)
        run: PLATFORMIO_CORE_DIR=$PWD/.pio-core pio run -d firmware/esp32 -e esp32

  esp32-ros:
    # micro-ROS downloads a prebuilt static library; this job is slower.
    runs-on: ubuntu-latest
    needs: esp32
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - uses: actions/cache@v4
        with:
          path: .pio-core
          key: pio-core-ros-${{ hashFiles('firmware/esp32/platformio.ini') }}
      - name: Build esp32-ros (web + serial + micro-ROS)
        run: PLATFORMIO_CORE_DIR=$PWD/.pio-core pio run -d firmware/esp32 -e esp32-ros
