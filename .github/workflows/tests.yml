name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "CITATION.cff"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "CITATION.cff"]
  workflow_dispatch:

# a newer push to the same branch cancels the run still in progress
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported Python and the one most new installs get
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The whole environment is cached: installing build123d and OpenCascade
      # is the slowest part of a run. A change to pyproject.toml rebuilds it.
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[cad]" pytest
      - name: Test
        # GPU tests skip themselves when jax is not installed.
        run: .venv/bin/pytest tests -q
