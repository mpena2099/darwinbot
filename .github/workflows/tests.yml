name: tests

on:
  push:
    # documentation and images do not change the tests
    paths-ignore: ["**.md", "docs/**", "LICENSE", "CITATION.cff"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "CITATION.cff"]
  workflow_dispatch:

# a newer push to the same branch cancels the run still in progress
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cad]" pytest
      - name: Test
        # GPU tests skip themselves when jax is not installed.
        run: pytest tests -q
