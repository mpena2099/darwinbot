; DarwinBot ESP32 layer: runs firmware/core (darwin_control) on a robot
; exported by experiments/export.py. Untested on hardware: no robot exists yet.
; Build with the core directory inside the project:
;   PLATFORMIO_CORE_DIR=$PWD/.pio-core pio run -d firmware/esp32 -e esp32

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; The control core needs std::clamp (C++17).
build_flags =
    -std=gnu++17
    ; Arduino's loop() (web + serial) on core 0; the control task owns core 1.
    -DARDUINO_RUNNING_CORE=0
    ; the portable core next door, never a copy of it
    -I../core
; The Arduino core pins gnu++11 after our flags; drop it so C++17 stands.
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.4.1
    ; files in data/: index.html and the export package's control.json
board_build.filesystem = littlefs

[env:esp32]
; web page, WebSocket telemetry and the serial console

[env:esp32-ros]
extends = env
build_flags = ${env.build_flags} -DDARWIN_ROS=1
lib_deps = ${env.lib_deps}
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
board_microros_transport = wifi
board_microros_distro = humble
