[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "darwinbot"
version = "0.1.0"
description = "Evolving robots you can actually build: bodies from real parts evolved with MAP-Elites, gaits with CMA-ES, simulated in MuJoCo."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mujoco>=3.6.0",
    "numpy>=1.23.0",
    "cma>=3.3",
    "ribs>=0.12",
    "matplotlib>=3.6.0",
    "numba>=0.58",
]

[project.optional-dependencies]
video = ["imageio[ffmpeg]"]
gpu = ["jax[cuda12]", "mujoco-mjx"]
warp = ["mujoco-warp>=3.17", "warp-lang>=1.18"]
cad = ["build123d>=0.12"]
docs = ["mkdocs-material>=9.5", "mkdocs>=1.6,<2"]   # MkDocs 2 drops what Material needs

[tool.setuptools.packages.find]
where = ["."]
include = ["darwinbot*"]
