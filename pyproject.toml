[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "darwinbot"
version = "0.1.0"
description = "Co-evolution of robot morphology and locomotion control using genetic algorithms."
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.6.0",
    "numpy>=1.23.0",
    "cma>=3.3",
    "matplotlib>=3.6.0",
]

[project.optional-dependencies]
video = ["imageio[ffmpeg]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["darwinbot*"]
